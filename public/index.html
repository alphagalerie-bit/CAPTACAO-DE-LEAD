<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectado — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%A1</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0e1326; --panel:#161d38; --panel2:#1e2748; --line:#2c3762;
  --text:#eef1fa; --dim:#99a3c9; --dim2:#6d78a3;
  --amber:#ffb454; --amber-ink:#2a1a04;
  --green:#6fd39b; --red:#ff8b8b; --blue:#7fb4ff; --purple:#c39bff;
  --r:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Public Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2;font-weight:600}
p{margin:0 0 .8em;color:var(--dim)}
a{color:var(--blue)}
.mono{font-family:'IBM Plex Mono',monospace}

.shell{display:flex;min-height:100vh}
aside{width:200px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:20px 0;display:flex;flex-direction:column}
.brand{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:1.25rem;padding:0 20px 16px}
.brand b{color:var(--amber);font-style:normal;font-weight:600}
nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.navbtn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;background:none;border:none;color:var(--dim);cursor:pointer;font:inherit;text-align:left;width:100%}
.navbtn:hover{background:var(--panel2);color:var(--text)}
.navbtn.on{background:var(--panel2);color:var(--amber);font-weight:600}
.navbtn .badge{margin-left:auto;font-size:11px;background:var(--amber);color:var(--amber-ink);border-radius:999px;padding:1px 7px;font-weight:700}
.sidefoot{margin-top:auto;padding:16px 20px 0;font-size:11px;color:var(--dim2);line-height:1.7}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim2);margin-right:5px}
.livedot.on{background:var(--green);box-shadow:0 0 7px var(--green)}
main{flex:1;min-width:0;padding:26px 30px 70px;overflow-x:hidden}
@media(max-width:820px){
  .shell{flex-direction:column}
  aside{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:14px 0}
  nav{flex-direction:row;overflow-x:auto;padding:0 12px}
  .navbtn{white-space:nowrap;padding:8px 12px}
  .sidefoot{display:none}
  main{padding:20px 16px 60px}
}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:1.5rem}
.topbar .sub{color:var(--dim);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;transition:filter .12s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-a{background:var(--amber);color:var(--amber-ink)}
.btn-g{background:var(--green);color:#08301c}
.btn-o{background:transparent;border-color:var(--line);color:var(--text)}
.btn-o:hover{border-color:var(--amber)}
.btn-d{background:transparent;border-color:#5c2b34;color:var(--red)}
.btn-s{padding:6px 11px;font-size:12.5px;border-radius:6px}
label.f{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}
input[type=range]{padding:0;height:4px;-webkit-appearance:none;background:var(--line);border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--amber)}
.row{display:grid;gap:14px;margin-bottom:14px}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.r2,.r3{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px}

.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.metric .n{font-family:'IBM Plex Mono',monospace;font-size:1.55rem;font-weight:600;line-height:1}
.metric .l{font-size:12px;color:var(--dim);margin-top:6px}
.metric.acc .n{color:var(--amber)}
.metric.ok .n{color:var(--green)}
.metric.bad .n{color:var(--red)}

.funil{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:12px;font-size:13px}
.fbar{height:22px;border-radius:4px;background:var(--panel2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:4px}
.frow .fn{text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--dim)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--panel2)}
.tbl .nm{font-weight:600}
.tbl .sm{font-size:12px;color:var(--dim)}
.tbl input{padding:6px 8px;font-size:13px}
.tbl td.num{text-align:right;font-family:'IBM Plex Mono',monospace}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.score{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px}
.sdot{width:8px;height:8px;border-radius:50%}
.s-hi{color:var(--green)} .s-hi .sdot{background:var(--green)}
.s-md{color:var(--amber)} .s-md .sdot{background:var(--amber)}
.s-lo{color:var(--dim2)} .s-lo .sdot{background:var(--dim2)}

.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin:2px 3px 2px 0;white-space:nowrap}
.tag.w{border-color:#5c4a24;color:var(--amber);background:rgba(255,180,84,.08)}
.tag.g{border-color:#2c5c42;color:var(--green);background:rgba(111,211,155,.08)}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.p-novo{background:rgba(127,180,255,.14);color:var(--blue)}
.p-abordado{background:rgba(255,180,84,.14);color:var(--amber)}
.p-respondeu{background:rgba(195,155,255,.14);color:var(--purple)}
.p-reuniao{background:rgba(111,211,155,.14);color:var(--green)}
.p-cliente{background:var(--green);color:#08301c}
.p-perdido{background:rgba(255,139,139,.12);color:var(--red)}

.kb{display:grid;grid-template-columns:repeat(6,minmax(175px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
@media(max-width:1100px){.kb{grid-template-columns:repeat(6,210px)}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:170px}
.colh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;font-weight:600}
.colh .c{font-family:'IBM Plex Mono',monospace;color:var(--dim)}
.lc{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;cursor:pointer}
.lc:hover{border-color:var(--amber)}
.lc .t{font-weight:600;font-size:13px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .m{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.empty{color:var(--dim2);font-size:12px;text-align:center;padding:14px 0}

.drawer-wrap{position:fixed;inset:0;z-index:60;display:none}
.drawer-wrap.on{display:block}
.ovl{position:absolute;inset:0;background:rgba(6,9,20,.7)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.db{padding:18px 20px;overflow-y:auto;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.x{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;word-break:break-word}
.hist{border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px}
.hist div{font-size:12.5px;margin-bottom:8px}
.hist time{color:var(--dim2);font-size:11px;display:block;font-family:'IBM Plex Mono',monospace}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:8px 12px;cursor:pointer;font:inherit;font-size:13px}
.tab.on{color:var(--amber);border-bottom-color:var(--amber);font-weight:600}

.queue{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.qnum{font-family:'IBM Plex Mono',monospace;color:var(--dim);font-size:12.5px;margin-bottom:10px}
.qactions{display:flex;gap:8px;flex-wrap:wrap}

.warn{background:rgba(255,180,84,.08);border:1px solid #5c4a24;border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--amber);margin-bottom:16px}
.warn b{color:var(--amber)}
.danger{background:rgba(255,139,139,.08);border-color:#5c2b34;color:var(--red)}
.danger b{color:var(--red)}
.note{font-size:12px;color:var(--dim2);margin-top:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--green);color:#08301c;padding:11px 20px;border-radius:999px;font-weight:600;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.hide{display:none!important}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar input,.bar select{width:auto;min-width:150px}

/* chat de teste */
.chat{background:var(--bg);border:1px solid var(--line);border-radius:10px;height:380px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.msg.eu{align-self:flex-end;background:var(--panel2);border-bottom-right-radius:3px}
.msg.ia{align-self:flex-start;background:#1f4535;color:#dff5e8;border-bottom-left-radius:3px}
.msg.sys{align-self:center;font-size:11.5px;color:var(--dim2);background:none;padding:2px}

/* qr */
.qrbox{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.qrimg{width:220px;height:220px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:10px;flex-shrink:0}
.qrimg img{width:100%;height:100%;image-rendering:pixelated}
.qrimg .ph{color:#666;font-size:12px;text-align:center;padding:16px}
.steps{counter-reset:s;padding-left:0;list-style:none;margin:0}
.steps li{counter-increment:s;padding-left:30px;position:relative;margin-bottom:9px;font-size:13px;color:var(--dim)}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--panel2);color:var(--amber);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>

<div class="shell">
  <aside>
    <div class="brand">Con<b>ectado</b></div>
    <nav id="nav">
      <button class="navbtn on" data-v="dash">Painel</button>
      <button class="navbtn" data-v="prosp">Prospecção</button>
      <button class="navbtn" data-v="crm">CRM <span class="badge" id="bd-crm">0</span></button>
      <button class="navbtn" data-v="fila">Disparo <span class="badge" id="bd-fila">0</span></button>
      <button class="navbtn" data-v="agente">Agente IA</button>
      <button class="navbtn" data-v="precos">Preços</button>
      <button class="navbtn" data-v="tpl">Mensagens</button>
      <button class="navbtn" data-v="cfg">Ajustes</button>
    </nav>
    <div class="sidefoot">
      <span class="livedot" id="foot-dot"></span><span id="foot-wa">WhatsApp offline</span><br>
      Enviados hoje <span class="mono" style="color:var(--amber)" id="foot-hoje">0</span><span class="mono" id="foot-lim">/30</span><br>
      MRR <span class="mono" style="color:var(--green)" id="foot-mrr">R$ 0</span>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div class="drawer-wrap" id="drawer">
  <div class="ovl" data-close></div>
  <div class="drawer" id="drawer-inner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   PAINEL DE CONTROLE - CONECTADO ADMIN v2
   ========================================================================== */
var CONFIG = {
  // Numero do WhatsApp do Conectado (DDI+DDD+numero, so digitos)
  meuWhatsApp: "5511972128715",

  meuNome: "Leo",
  minhaEmpresa: "Conectado",
  meuLink: "https://conectado.alphagalerie.com",

  // Gateway Node que segura a sessao do WhatsApp, roda o agente de IA
  // e gera os links de pagamento. Ex: "https://conectado-gateway.up.railway.app"
  // Vazio = admin funciona sozinho, sem WhatsApp conectado e sem IA real.
  gateway: "",

  // Token que o admin manda pro gateway (defina o mesmo valor no .env do gateway)
  gatewayToken: "",

  // Busca de lojas no Google, via Netlify Function deste mesmo site.
  // So funciona de verdade depois que GOOGLE_MAPS_KEY estiver no painel do
  // Netlify. Enquanto nao estiver, a busca cai sozinha em modo demonstracao.
  endpointProspeccao: "/.netlify/functions/prospectar",

  // Mercado Pago - SO a Public Key vai aqui. Ela e publica por design.
  // O Access Token fica no .env do gateway e NUNCA neste arquivo.
  mpPublicKey: "APP_USR-4fceeb1b-1005-40ca-8fb9-2066f9baa6ea",

  limiteDiario: 30,
  intervaloSegundos: 45
};
/* ========================================================================== */

var KEY = 'conectado_crm_v2';
var ETAPAS = [
  {id:'novo',cor:'#7fb4ff',nome:'Novo'},
  {id:'abordado',cor:'#ffb454',nome:'Abordado'},
  {id:'respondeu',cor:'#c39bff',nome:'Respondeu'},
  {id:'reuniao',cor:'#6fd39b',nome:'Reunião'},
  {id:'cliente',cor:'#6fd39b',nome:'Cliente'},
  {id:'perdido',cor:'#ff8b8b',nome:'Perdido'}
];

/* ---------- tabela de precos padrao (voce edita na aba Precos) ---------- */
var PRECOS_PADRAO = {
  servicos: [
    {id:'ia',    nome:'Atendimento IA no WhatsApp',   setup:297,  mensal:59.90, custo:12.00, ativo:true,
     desc:'Agente responde 24h, qualifica e agenda. Inclui treino com os dados da loja.'},
    {id:'site',  nome:'Site institucional (1 página)', setup:697,  mensal:19.90, custo:3.00,  ativo:true,
     desc:'Página única, responsiva, com formulário e botão de WhatsApp.'},
    {id:'loja',  nome:'Catálogo / loja virtual',       setup:1197, mensal:29.90, custo:5.00,  ativo:true,
     desc:'Catálogo com carrinho e checkout por Pix ou cartão.'},
    {id:'geo',   nome:'Google Meu Negócio (GEO)',      setup:197,  mensal:14.90, custo:2.00,  ativo:true,
     desc:'Ficha otimizada, fotos, categorias e resposta de avaliações.'},
    {id:'lp',    nome:'Landing page de campanha',      setup:397,  mensal:9.90,  custo:2.00,  ativo:true,
     desc:'Página de captação para uma oferta específica, com rastreamento.'},
    {id:'pag',   nome:'Integração de pagamento',       setup:297,  mensal:9.90,  custo:1.50,  ativo:true,
     desc:'Pix e cartão via Mercado Pago, link de cobrança automático.'},
    {id:'traf',  nome:'Gestão de tráfego pago',        setup:0,    mensal:397,   custo:60.00, ativo:true,
     desc:'Criação e otimização de campanhas. Verba de anúncio à parte.'}
  ],
  pacotes: [
    {id:'p1', nome:'Essencial',  servicos:['ia','geo'],                    desconto:10},
    {id:'p2', nome:'Presença',   servicos:['ia','site','geo'],             desconto:12},
    {id:'p3', nome:'Completo',   servicos:['ia','site','geo','pag'],       desconto:15},
    {id:'p4', nome:'Máximo',     servicos:['ia','loja','geo','pag','lp'],  desconto:18}
  ],
  regras: {
    descontoMaxAgente: 10,
    parcelasSetup: 3,
    diasTeste: 7
  }
};

/* ---------- treino padrao do agente ---------- */
var AGENTE_PADRAO = {
  nome: 'Nina',
  tom: 'direto e simpático, sem formalidade exagerada',
  instrucoes:
'Você é a Nina, atendente do Conectado. Fala por WhatsApp com donos de pequenos negócios no Brasil.\n\n' +
'O QUE O CONECTADO FAZ\n' +
'Instala um atendente de IA no WhatsApp do cliente para responder 24h, qualificar quem chega e agendar. Também fazemos site, catálogo, ficha do Google e integração de pagamento.\n\n' +
'COMO VOCÊ FALA\n' +
'- Mensagens curtas, de duas a quatro linhas. É WhatsApp, não e-mail.\n' +
'- Uma pergunta por vez. Nunca dispare três perguntas juntas.\n' +
'- Português do Brasil, informal mas profissional. Emoji só quando couber, no máximo um.\n' +
'- Nunca invente número, prazo ou recurso. Se não souber, diga que vai confirmar com o Leo.\n\n' +
'O QUE DESCOBRIR (nesta ordem, conversando, sem parecer formulário)\n' +
'1. Que tipo de negócio é e o que vende\n' +
'2. Quem responde o WhatsApp hoje e em que horário\n' +
'3. Quantas mensagens chegam por dia, mais ou menos\n' +
'4. Se já tem site ou ficha no Google\n' +
'5. O que mais incomoda hoje no atendimento\n\n' +
'COMO CONDUZIR\n' +
'- Primeiro entenda a dor, só depois fale de preço.\n' +
'- Quando perguntarem preço antes da hora, responda a faixa e volte para a pergunta que faltava.\n' +
'- Use os valores da tabela de preços, sem arredondar nem improvisar.\n' +
'- O objetivo de toda conversa é marcar uma demonstração de 15 minutos ou mandar o link de pagamento.\n\n' +
'LIMITES\n' +
'- Desconto: no máximo o percentual definido na tabela. Acima disso, passe para o Leo.\n' +
'- Não prometa prazo de entrega sem confirmar.\n' +
'- Não fale mal de concorrente.\n' +
'- Se a pessoa pedir para não ser mais contatada, confirme com educação, encerre e marque como opt-out.\n' +
'- Se a pessoa ficar irritada, parar de responder objeções ou pedir para falar com humano, chame o Leo imediatamente.\n\n' +
'ABRINDO A CONVERSA (quando o lead responde uma abordagem fria)\n' +
'Agradeça o retorno, confirme rapidamente o que o Conectado faz em uma frase e faça a primeira pergunta de qualificação.',

  faq: [
    {p:'Quanto custa?', r:'Depende do que a loja precisa. Só o atendimento de IA no WhatsApp fica em R$297 de instalação e R$59,90 por mês. Se quiser site e ficha do Google junto, entra como pacote e fica mais em conta. Me conta rapidinho o que você vende que eu te digo o valor certo.'},
    {p:'Tem fidelidade?', r:'Não. Você cancela quando quiser, sem multa. A instalação é paga uma vez e a mensalidade acompanha enquanto estiver usando.'},
    {p:'A IA vai responder errado pros meus clientes?', r:'Ela é treinada com as informações da sua loja e só fala do que você aprovou. Quando não sabe algo, ela avisa o cliente e chama você. Nada de resposta inventada.'},
    {p:'Preciso trocar de número?', r:'Não. Ela entra no número que você já usa. Seus clientes não percebem mudança nenhuma.'},
    {p:'E se eu quiser responder pessoalmente?', r:'Você responde quando quiser, a IA sai da conversa na hora. Ela cobre o que você não consegue cobrir.'},
    {p:'Em quanto tempo fica pronto?', r:'O atendimento no WhatsApp normalmente entra no ar em até 3 dias úteis depois que você manda as informações da loja.'},

/* ---------- persistencia ---------- */
function carregar(){
  try{ var raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){ console.warn(e); }
  if(!S.leads) S.leads=[];

}
function salvar(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ console.warn(e); } }
function hojeStr(){ return new Date().toISOString().slice(0,10); }

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},2400);}
function saudacao(){var h=new Date().getHours();return h<12?'Bom dia':(h<18?'Boa tarde':'Boa noite');}
function normTel(t){var d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.indexOf('55')===0&&d.length>=12)return d;if(d.length===10||d.length===11)return '55'+d;return d;}
function telBonito(t){var d=normTel(t);if(d.length<12)return t||'—';var dd=d.slice(2,4),r=d.slice(4);return '('+dd+') '+r.slice(0,r.length-4)+'-'+r.slice(-4);}
function dataBR(i){if(!i)return'—';var d=new Date(i);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function diasDesde(i){return i?Math.floor((Date.now()-new Date(i).getTime())/86400000):null;}
function brl(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function num(v){var n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;}

/* ---------- score ---------- */
function calcularScore(l){
  var s=20,sin=[];
  if(!l.site){s+=25;sin.push('Sem site');} else if(l.semChat){s+=18;sin.push('Site sem chat/bot');}
  if(l.temWhatsapp===false){s+=10;sin.push('WhatsApp não confirmado');}
  if(l.reviews!=null&&l.reviews<30){s+=12;sin.push('Pouca presença online');}
  if(l.rating!=null&&l.rating<4.2){s+=12;sin.push('Nota baixa');}
  if(l.respondeReviews===false){s+=10;sin.push('Não responde avaliações');}
  if(l.horarioLimitado){s+=8;sin.push('Horário curto');}
  if(!l.telefone){s-=30;sin.push('Sem telefone');}
  l.sinais=sin; l.score=Math.max(0,Math.min(100,s)); return l.score;
}
function classeScore(n){return n>=65?'s-hi':(n>=40?'s-md':'s-lo');}

/* ---------- precos ---------- */
function servico(id){ return S.precos.servicos.find(function(s){return s.id===id;}); }
function melhorPacote(ids){
  var melhor=null;
  S.precos.pacotes.forEach(function(p){
    var cobre=p.servicos.every(function(x){ return ids.indexOf(x)>-1; });
    if(cobre && (!melhor||p.desconto>melhor.desconto)) melhor=p;
  });
  return melhor;
}
function calcularContrato(ids){
  var setup=0, mensal=0, custo=0;
  ids.forEach(function(id){ var s=servico(id); if(s){ setup+=num(s.setup); mensal+=num(s.mensal); custo+=num(s.custo); } });
  var p=melhorPacote(ids);
  var desc=p?p.desconto:0;
  return {
    servicos:ids,
    pacote:p?p.nome:'Avulso',
    desconto:desc,
    setupCheio:setup, mensalCheio:mensal,
    setup:setup*(1-desc/100), mensal:mensal*(1-desc/100),
    custo:custo,
    margem: mensal*(1-desc/100)-custo
  };
}
function mrrTotal(){
  return S.leads.filter(function(l){return l.status==='cliente'&&l.contrato;})
    .reduce(function(a,l){return a+num(l.contrato.mensal);},0);
}

/* ---------- mensagens ---------- */
function montarMensagem(txt,l){
  var bairro='';
  if(l.endereco){var p=l.endereco.split(',');bairro=(p.length>1?p[1]:p[0]).trim();}
  return String(txt)
    .replace(/\{saudacao\}/g,saudacao())
    .replace(/\{nome\}/g,l.nome||'sua loja')
    .replace(/\{categoria\}/g,(l.categoria||'esse serviço').toLowerCase())
    .replace(/\{bairro\}/g,bairro||'sua região')
    .replace(/\{meuNome\}/g,CONFIG.meuNome)
    .replace(/\{minhaEmpresa\}/g,CONFIG.minhaEmpresa)
    .replace(/\{meuLink\}/g,CONFIG.meuLink)
    .replace(/\{pacote\}/g,(l.contrato&&l.contrato.pacote)||'plano')
    .replace(/\{linkPagamento\}/g,(l.contrato&&l.contrato.linkPagamento)||'(gere o link na ficha do lead)');
}
function abrirWhats(tel,msg){
  var n=normTel(tel);
  if(!n){toast('Esse lead não tem telefone válido');return false;}
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');
  return true;
}
function registrar(id,txt){
  var l=S.leads.find(function(x){return x.id===id;}); if(!l)return;
  if(!l.historico) l.historico=[];
  l.historico.unshift({em:new Date().toISOString(),texto:txt});
  S.log.unshift({em:new Date().toISOString(),lead:l.nome,texto:txt});
  if(S.log.length>300) S.log.length=300;
}

/* ---------- gateway ---------- */
async function api(rota,body){
  if(!CONFIG.gateway) throw new Error('Gateway não configurado. Preencha o campo gateway no bloco CONFIG.');
  var r=await fetch(CONFIG.gateway.replace(/\/$/,'')+rota,{
    method: body?'POST':'GET',
    headers:{'Content-Type':'application/json','x-conectado-token':CONFIG.gatewayToken||''},
    body: body?JSON.stringify(body):undefined
  });
  var d=await r.json().catch(function(){return {};});
  if(!r.ok) throw new Error(d.erro||('HTTP '+r.status));
  return d;
}
async function checarWhats(){
  if(!CONFIG.gateway) return;
  try{
    var d=await api('/status');
    WA.conectado=!!d.conectado; WA.numero=d.numero||'';
    atualizarRodape();
    if(VIEW==='cfg') render();
  }catch(e){ WA.conectado=false; atualizarRodape(); }
}
function atualizarRodape(){
  var dot=document.getElementById('foot-dot');

}

function gerarDemo(nicho,local,n){
  var pre=['Central','Ponto','Casa','Espaço','Mundo','Top','Mega','Vila','Nova','Studio','Reduto','Cantinho'];
  var suf=['do Bairro','Express','Prime','& Cia','Popular','da Esquina','Norte','Life','Center','Log'];
  var ruas=['Av. Imirim','R. Parapuã','Av. Água Fria','R. Alfredo Pujol','Av. Braz Leme','R. Voluntários da Pátria'];
  var out=[];
  for(var i=0;i<n;i++){
    var tem=Math.random()>0.42;
    var l={id:uid(),nome:pre[i%pre.length]+' '+(nicho.charAt(0).toUpperCase()+nicho.slice(1))+' '+suf[(i*3)%suf.length],
      categoria:nicho,endereco:ruas[i%ruas.length]+', '+(100+i*37)+' - '+local,
      telefone:'5511'+(900000000+i).toString().slice(0,9),
      site:tem?'https://exemplo-loja-'+(i+1)+'.com.br':'',semChat:tem?Math.random()>0.25:false,
      rating:Math.round((3.4+Math.random()*1.6)*10)/10,reviews:Math.floor(Math.random()*180),
      respondeReviews:Math.random()>0.65,horarioLimitado:Math.random()>0.55,temWhatsapp:Math.random()>0.2,
      status:'novo',origem:'Demonstração',criadoEm:new Date().toISOString(),historico:[]};
    calcularScore(l); out.push(l);
  }
  return out;
}
async function buscarLojas(){
  var nicho=document.getElementById('p-nicho').value.trim()||'loja';
  var local=document.getElementById('p-local').value.trim()||'São Paulo';
  var raio=parseInt(document.getElementById('p-raio').value,10);
  var max=parseInt(document.getElementById('p-max').value,10);
  var soTel=document.getElementById('p-f1').checked, soSemSite=document.getElementById('p-f2').checked, ign=document.getElementById('p-f3').checked;
  var box=document.getElementById('p-resultados');
  box.innerHTML='<div class="card"><div class="empty">Buscando lojas...</div></div>';
  var achados=[];
  if(CONFIG.endpointProspeccao){
    try{
      var r=await fetch(CONFIG.endpointProspeccao,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nicho:nicho,local:local,raioKm:raio,max:max})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      var d=await r.json();
      achados=(d.lojas||[]).map(function(p){var l=Object.assign({id:uid(),status:'novo',origem:'Google Places',criadoEm:new Date().toISOString(),historico:[]},p);calcularScore(l);return l;});
    }catch(e){
      // Sem chave do Google configurada a busca real nao roda. Em vez de travar,
      // cai no modo demonstracao e avisa o que falta.
      await new Promise(function(r){setTimeout(r,300);});
      achados=gerarDemo(nicho,local,max);
      window._avisoDemo='Busca real indispon\u00edvel ('+e.message+'). Mostrando lojas de demonstra\u00e7\u00e3o. Para buscar de verdade, cadastre GOOGLE_MAPS_KEY no painel do Netlify.';
    }
  } else { await new Promise(function(r){setTimeout(r,500);}); achados=gerarDemo(nicho,local,max); }
  if(soTel) achados=achados.filter(function(l){return !!l.telefone;});
  if(soSemSite) achados=achados.filter(function(l){return !l.site;});
  if(ign){var tels=S.leads.map(function(l){return normTel(l.telefone);});achados=achados.filter(function(l){return tels.indexOf(normTel(l.telefone))===-1;});}
  achados.sort(function(a,b){return b.score-a.score;});
  window._achados=achados;
  var aviso=window._avisoDemo?'<div class="warn">'+esc(window._avisoDemo)+'</div>':'';
  window._avisoDemo=null;
  if(!achados.length){box.innerHTML=aviso+'<div class="card"><div class="empty">Nenhuma loja com esses filtros. Aumente o raio ou troque o nicho.</div></div>';return;}
  var linhas=achados.map(function(l,i){

function pintarChat(){
  var c=document.getElementById('chat'); if(!c) return;
  if(!CHAT.length){
    c.innerHTML='<div class="msg sys">Escreva como se fosse um lead que acabou de responder sua abordagem.</div>';
    return;
  }
  c.innerHTML=CHAT.map(function(m){return '<div class="msg '+m.de+'">'+esc(m.txt)+'</div>';}).join('');
  c.scrollTop=c.scrollHeight;
}
async function enviarChat(){
  var inp=document.getElementById('chat-in');
  var txt=inp.value.trim(); if(!txt) return;
  CHAT.push({de:'eu',txt:txt}); inp.value=''; pintarChat();
  CHAT.push({de:'sys',txt:'digitando...'}); pintarChat();
  var resposta;
  if(CONFIG.gateway){
    try{
      var d=await api('/agente/testar',{historico:CHAT.filter(function(m){return m.de!=='sys';}).map(function(m){return {role:m.de==='eu'?'user':'assistant',content:m.txt};}),agente:S.agente,precos:S.precos});
      resposta=d.resposta;
    }catch(e){ resposta='[erro no gateway] '+e.message; }
  } else {
    resposta=respostaRoteiro(txt);
  }
  CHAT=CHAT.filter(function(m){return m.de!=='sys';});
  CHAT.push({de:'ia',txt:resposta}); pintarChat();
}
/* fallback sem IA: casa com o FAQ, senao segue o roteiro de qualificacao */
function respostaRoteiro(txt){
  var t=txt.toLowerCase();
  var hit=S.agente.faq.find(function(f){
    return f.p.toLowerCase().split(/\s+/).filter(function(w){return w.length>4;}).some(function(w){return t.indexOf(w)>-1;});
  });
  if(hit) return hit.r;
  if(/pre[çc]o|valor|quanto/.test(t)){
    var ia=servico('ia');
    return 'Só o atendimento de IA no WhatsApp fica em '+brl(ia.setup)+' de instalação e '+brl(ia.mensal)+' por mês. Mas depende do que sua loja precisa — me conta rapidinho o que você vende?';
  }
  var perguntas=['Legal! Me conta: que tipo de negócio é o seu?','E quem responde o WhatsApp de vocês hoje, em que horário?','Mais ou menos quantas mensagens chegam por dia?','Vocês já têm site ou ficha no Google?','O que mais te incomoda no atendimento hoje?'];
  var n=CHAT.filter(function(m){return m.de==='ia';}).length;
  return (perguntas[n]||'Perfeito. Posso te mostrar funcionando numa demonstração de 15 minutos? Prefere hoje à tarde ou amanhã de manhã?');
}

/* ---------- csv ---------- */
function exportarCSV(){
  var cols=['nome','categoria','endereco','telefone','site','rating','reviews','score','status','origem','ultimoContato','notas'];
  var lin=[cols.concat(['pacote','setup','mensal','vencimento','pagamento']).join(';')];
  S.leads.forEach(function(l){
    var base=cols.map(function(c){return '"'+String(l[c]==null?'':l[c]).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';});
    var ct=l.contrato||{};
    base=base.concat([ct.pacote||'',ct.setup||'',ct.mensal||'',ct.diaVencimento||'',ct.statusPagamento||''].map(function(v){return '"'+v+'"';}));
    lin.push(base.join(';'));
  });
  baixar(lin.join('\n'),'conectado-leads-'+hojeStr()+'.csv','text/csv;charset=utf-8;');
}
function baixar(txt,nome,tipo){
  var b=new Blob(['\ufeff'+txt],{type:tipo}); var a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},200);
}
function importarCSV(txt){
  var lin=txt.split(/\r?\n/).filter(function(x){return x.trim();});
  if(lin.length<2){toast('CSV vazio');return;}
  var sep=lin[0].indexOf(';')>-1?';':',';
  var cab=lin[0].split(sep).map(function(c){return c.replace(/^"|"$/g,'').trim().toLowerCase();});
  var n=0;
  lin.slice(1).forEach(function(ln){
    var v=ln.split(sep).map(function(c){return c.replace(/^"|"$/g,'').trim();});
    var o={}; cab.forEach(function(c,i){o[c]=v[i]||'';});
    if(!o.nome&&!o.telefone) return;
    var l={id:uid(),nome:o.nome||'Sem nome',categoria:o.categoria||'',endereco:o.endereco||'',telefone:o.telefone||'',
      site:o.site||'',rating:parseFloat(o.rating)||null,reviews:parseInt(o.reviews,10)||null,semChat:true,
      status:o.status||'novo',origem:o.origem||'Importado',notas:o.notas||'',criadoEm:new Date().toISOString(),historico:[]};
    calcularScore(l); S.leads.push(l); n++;
  });
  salvar(); render(); toast(n+' leads importados');
}

    salvar(); toast('Contrato salvo'); render(); abrirLead(l.id);
  }

    if(!l.contrato){toast('Salve o contrato primeiro');return;}

    try{
      var d=await api('/pagamento/criar',{lead:{id:l.id,nome:l.nome,telefone:normTel(l.telefone)},contrato:l.contrato});
      l.contrato.linkPagamento=d.link;

  else if(t.id==='d-reuniao'){mover(l.id,'reuniao');fecharDrawer();}
  else if(t.id==='d-perdido'){mover(l.id,'perdido');fecharDrawer();}
  else if(t.id==='d-excluir'){
    if(confirm('Excluir '+l.nome+'?')){S.leads=S.leads.filter(function(x){return x.id!==l.id;});salvar();fecharDrawer();render();}
  }
});

    try{ await api('/whatsapp/sair',{}); WA.conectado=false; render(); toast('Desconectado'); }catch(err){ toast(err.message); }
    return;
  }

  /* ajustes */
  if(t.id==='cfg-exp'){baixar(JSON.stringify(S,null,2),'conectado-backup-'+hojeStr()+'.json','application/json');return;}
  if(t.id==='cfg-zerar'){
    if(confirm('Apagar TODOS os leads? Não tem volta. Exporte antes.')){S.leads=[];S.log=[];salvar();render();toast('CRM zerado');}
    return;
  }
});

document.getElementById('view').addEventListener('input',function(e){
  if(e.target.id==='p-raio'){document.getElementById('p-raio-v').textContent=e.target.value+' km';}
  if(e.target.id==='crm-busca'){
    window._busca=e.target.value; var p=e.target.selectionStart; render();
    var el=document.getElementById('crm-busca'); if(el){el.focus();el.setSelectionRange(p,p);}
  }
});
document.getElementById('view').addEventListener('change',function(e){
  if(e.target.id==='imp-csv'){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(){importarCSV(r.result);}; r.readAsText(f,'UTF-8');
  }
  if(e.target.classList.contains('pk-sv')){
    var i=+e.target.getAttribute('data-i'), id=e.target.getAttribute('data-id');
    var p=S.precos.pacotes[i];
    if(e.target.checked){ if(p.servicos.indexOf(id)===-1) p.servicos.push(id); }
    else p.servicos=p.servicos.filter(function(x){return x!==id;});
    salvar(); render();
  }
});
document.getElementById('view').addEventListener('keydown',function(e){
  if(e.target.id==='chat-in'&&e.key==='Enter'){e.preventDefault();enviarChat();}
});

/* ---------- start ---------- */
carregar();
render();
checarWhats();
setInterval(checarWhats,30000);
</script>
</body>
</html>
